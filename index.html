<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Снегопад</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #0d1117; color: #e6edf3; font: 16px/1.4 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  main { position: relative; z-index: 1; text-align: center; padding: 16px; }
  h1 { margin: 0 0 24px; font-size: 44px; font-weight: 600; }
  a { display: inline-block; padding: 14px 32px; border-radius: 10px; background: #e6edf3; color: #0d1117; font-weight: 600; text-decoration: none; }
  a:hover { background: #fff; }
  p { margin: 14px 0 0; color: #8b949e; font-size: 13px; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1>❄ Снегопад</h1>
  <a href="https://github.com/vasyapetkin/snegopad/releases/latest/download/Snegopad.zip">Скачать</a>
  <p>Windows · 100 МБ · распаковать и запустить Снегопад.exe</p>
</main>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let w, h, f = [];
function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
size(); addEventListener('resize', size);
for (let i = 0; i < 120; i++) f.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 1, s: Math.random() * 0.8 + 0.4 });
(function tick() {
  x.clearRect(0, 0, w, h); x.fillStyle = 'rgba(255,255,255,.8)';
  for (const p of f) {
    p.y += p.s; p.x += Math.sin(p.y / 40) * 0.3;
    if (p.y > h) { p.y = -4; p.x = Math.random() * w; }
    x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
